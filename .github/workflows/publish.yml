name: Publish Package to npmjs

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(jq -r .version package.json)"
          if [ "${RELEASE_TAG#v}" != "$pkg_version" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Publish
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$NPM_DIST_TAG"
