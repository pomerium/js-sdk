name: Publish Package to npmjs

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1
      - name: Check npm version
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is too old for Trusted Publishing (need >= 11.5.1)`); process.exit(1); }
          ' "$(npm --version)"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_TAG#v}" != "$pkg_version" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package.json version ${pkg_version}"
            exit 1
          fi

      # Build artifacts are generated by the `prepack` script, which runs as part of `npm publish`.
      # No NODE_AUTH_TOKEN is needed: npm authenticates via OIDC (Trusted Publishing) and
      # generates a provenance statement automatically.
      - name: Publish
        run: npm publish
